# Development setup: uses your local LMS clone instead of fetching from GitHub.
# Run from repo root: docker compose -f docker/docker-compose.dev.yml up
# Or from docker folder: docker compose -f docker-compose.dev.yml up
version: "3.7"
name: lms-dev
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data-dev:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/docker/init-dev.sh
    env_file:
      - .env
    environment:
      - SHELL=/bin/bash
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_THINK_PROVIDER=${DEEPGRAM_THINK_PROVIDER:-}
      - DEEPGRAM_THINK_MODEL=${DEEPGRAM_THINK_MODEL:-}
      - DEEPGRAM_LISTEN_MODEL=${DEEPGRAM_LISTEN_MODEL:-}
      - DEEPGRAM_SPEAK_MODEL=${DEEPGRAM_SPEAK_MODEL:-}
    working_dir: /home/frappe
    volumes:
      # Mount entire repo so bench can install app from local path
      - ..:/workspace
    ports:
      - 8000:8000
      - 9000:9000
    depends_on:
      - mariadb
      - redis

volumes:
  mariadb-data-dev:
